<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Demostración visual del asistente virtual Coomeva.">
<title>Asistente Virtual Coomeva — Demo</title>
<style>
    :root {
        --sage: #eef3ee;
        --sage-deep: #427952;
        --bot: #fff;
        --user: #c9f6aa;
        --text: #050806;
        --muted: #667369;
        --accent: #397953;
        --accent-dark: #2c6142;
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--text); font-family: "Segoe UI", Helvetica, Arial, sans-serif; background: var(--sage-deep); }
    button, input { font: inherit; }
    .page { min-height: 100vh; display: grid; place-items: start center; padding: 0 18px; }
    .app { width: min(100%, 520px); min-height: min(680px, 82vh); display: flex; flex-direction: column; overflow: hidden; border-radius: 30px 30px 0 0; background: var(--sage); box-shadow: 0 15px 44px rgba(9, 25, 13, .19); }
    .topbar { min-height: 76px; display: flex; align-items: center; gap: 12px; padding: 13px 20px; background: var(--sage); }
    .back { border: 0; padding: 0; color: var(--text); font: 42px/1 Arial, sans-serif; background: transparent; cursor: pointer; }
    .avatar { display: grid; width: 48px; height: 48px; flex: 0 0 48px; place-items: center; border: 3px solid rgba(255,255,255,.78); border-radius: 50%; color: #fff; font-size: 21px; font-weight: 750; letter-spacing: -2px; background: radial-gradient(circle at 30% 28%, #b8efd0 0 13%, transparent 14%), linear-gradient(135deg, #77ba9a, #397953 72%); }
    .identity { min-width: 0; }
    .identity strong, .identity small { display: block; }
    .identity strong { font-size: clamp(18px, 2.6vw, 23px); letter-spacing: -.4px; }
    .identity small { margin-top: 1px; color: #8b938c; font-size: clamp(12px, 1.7vw, 16px); }
    .header-icons { margin-left: auto; color: var(--text); font-size: 22px; letter-spacing: 3px; white-space: nowrap; }
    .chat { flex: 1; display: flex; flex-direction: column; align-items: flex-start; gap: 10px; padding: 10px 22px 24px; overflow-y: auto; background: var(--sage); }
    .bubble { position: relative; max-width: min(80%, 410px); padding: 13px 18px; border-radius: 24px; font-size: clamp(16px, 2.1vw, 20px); line-height: 1.2; letter-spacing: -.3px; }
    .bubble p { margin: 0 0 9px; }
    .bubble p:last-child { margin-bottom: 0; }
    .bot { align-self: flex-start; margin-left: 60px; background: var(--bot); }
    .bot::before { content: "C"; position: absolute; top: 50%; left: -60px; display: grid; width: 46px; height: 46px; place-items: center; transform: translateY(-50%); border: 2px solid rgba(255,255,255,.84); border-radius: 50%; color: #fff; font-size: 19px; font-weight: 750; letter-spacing: -2px; background: radial-gradient(circle at 30% 28%, #b8efd0 0 13%, transparent 14%), linear-gradient(135deg, #77ba9a, #397953 72%); }
    .user { align-self: flex-end; background: var(--user); }
    .consent { width: min(80%, 410px); margin-left: 60px; padding: 16px 18px; border-radius: 24px; background: #fff; }
    .check { display: flex; gap: 11px; align-items: flex-start; margin-bottom: 15px; color: #202520; font-size: 14px; line-height: 1.35; cursor: pointer; }
    .check input { width: 20px; height: 20px; flex: 0 0 20px; margin: 1px 0 0; accent-color: var(--accent); }
    .check a { color: #18725f; font-weight: 700; }
    .primary, .link-button { display: inline-flex; align-items: center; justify-content: center; min-height: 45px; border: 0; border-radius: 999px; padding: 10px 17px; color: #fff; font-size: 15px; font-weight: 700; text-decoration: none; cursor: pointer; background: var(--accent); transition: background .16s ease, transform .16s ease; }
    .primary { width: 100%; }
    .primary:hover, .link-button:hover { background: var(--accent-dark); transform: translateY(-1px); }
    .text-button { width: min(80%, 410px); margin-left: 60px; border: 0; padding: 7px; color: var(--muted); font-size: 14px; text-decoration: underline; cursor: pointer; background: transparent; }
    .compose { width: 100%; display: flex; gap: 10px; align-items: center; margin-top: auto; padding: 7px 7px 7px 18px; border-radius: 999px; background: #fff; }
    .compose input { width: 100%; min-height: 43px; border: 0; outline: 0; color: var(--text); font-size: 16px; background: transparent; }
    .compose input::placeholder { color: #a2aaa3; }
    .send { display: grid; width: 42px; height: 42px; flex: 0 0 42px; place-items: center; border: 0; border-radius: 50%; color: #fff; font-size: 19px; cursor: pointer; background: var(--accent); }
    .menu { width: min(80%, 410px); display: grid; gap: 8px; margin-left: 60px; }
    .option { width: 100%; min-height: 46px; border: 0; border-radius: 999px; padding: 10px 16px; color: var(--text); font-size: 16px; text-align: left; cursor: pointer; background: #fff; }
    .option:hover { background: #f8fcf7; }
    .notice { width: min(80%, 410px); margin: 0 0 0 60px; color: var(--muted); font-size: 11px; line-height: 1.35; text-align: center; }
    .modal { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 20px; background: rgba(5, 20, 9, .48); }
    .modal[hidden] { display: none; }
    .modal-card { width: min(100%, 560px); max-height: min(700px, 90vh); overflow-y: auto; padding: 28px; border-radius: 24px; background: #fff; box-shadow: 0 18px 60px rgba(0,0,0,.25); }
    .modal-card h2 { margin: 0 0 14px; font-size: 23px; }
    .modal-card p { color: #34444d; line-height: 1.48; }
    .modal-card .small { color: var(--muted); font-size: 13px; }
    .modal-close { margin-top: 12px; }
    @media (max-width: 600px) {
        .page { display: block; padding: 0; background: var(--sage); }
        .app { width: 100%; min-height: 100vh; border-radius: 0; box-shadow: none; }
        .topbar { min-height: 70px; padding: 11px 16px; }
        .back { font-size: 36px; }
        .avatar { width: 43px; height: 43px; flex-basis: 43px; font-size: 19px; }
        .header-icons { font-size: 19px; }
        .chat { padding: 10px 16px 25px; }
        .bubble { max-width: calc(100% - 58px); font-size: 18px; }
        .bot { margin-left: 58px; }
        .bot::before { left: -58px; width: 44px; height: 44px; }
        .consent, .text-button, .menu, .notice { width: calc(100% - 58px); margin-left: 58px; }
    }
</style>
</head>
<body>
<main class="page">
    <section class="app" aria-label="Demostración del asistente virtual Coomeva">
        <header class="topbar">
            <button class="back" id="restart" type="button" aria-label="Reiniciar conversación">‹</button>
            <span class="avatar" aria-hidden="true">C</span>
            <div class="identity"><strong>Asistente Coomeva</strong><small>● En línea</small></div>
            <span class="header-icons" aria-hidden="true">▢ ☎</span>
        </header>
        <section class="chat" id="chat" aria-live="polite"></section>
    </section>
</main>

<section class="modal" id="legalModal" hidden aria-modal="true" role="dialog" aria-labelledby="legalTitle">
    <article class="modal-card">
        <h2 id="legalTitle"></h2>
        <div id="legalText"></div>
        <p class="small">Texto informativo de demostración. Coomeva debe revisar y aprobar los textos legales definitivos antes de producción.</p>
        <button class="primary modal-close" type="button" id="closeLegal">Entendido</button>
    </article>
</section>

<script>
(() => {
    'use strict';

    const chat = document.querySelector('#chat');
    const legalModal = document.querySelector('#legalModal');
    const legalTitle = document.querySelector('#legalTitle');
    const legalText = document.querySelector('#legalText');
    let state = { consent: false, userType: null, userName: '', advisorsAvailable: 2, advisorAssigned: false };

    const text = {
        terms: {
            title: 'Términos y condiciones',
            body: '<p>Este asistente permite consultar información y solicitar orientación. No reemplaza la atención médica, financiera ni contractual de Coomeva.</p><p>La información publicada en el canal definitivo debe ser aprobada por Coomeva.</p>'
        },
        privacy: {
            title: 'Tratamiento de datos personales',
            body: '<p>La autorización permite validar afiliación y atender la solicitud. El titular puede conocer, actualizar, rectificar o solicitar la supresión de sus datos por los canales oficiales que defina Coomeva.</p><p>Esta demo no recopila, transmite ni almacena datos personales reales.</p>'
        }
    };

    function escapeHtml(value) {
        const element = document.createElement('div');
        element.textContent = value;
        return element.innerHTML;
    }

    function scrollDown() { chat.scrollTop = chat.scrollHeight; }

    function addBubble(message, sender = 'bot') {
        const bubble = document.createElement('article');
        bubble.className = `bubble ${sender}`;
        bubble.innerHTML = `<p>${message}</p>`;
        chat.append(bubble);
        scrollDown();
    }

    function addButton(label, action, className = 'link-button') {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = className;
        button.textContent = label;
        button.addEventListener('click', action);
        chat.append(button);
        scrollDown();
    }

    function addMenu(options) {
        const menu = document.createElement('nav');
        menu.className = 'menu';
        menu.setAttribute('aria-label', 'Opciones de atención');
        options.forEach(({ label, action }) => {
            const button = document.createElement('button');
            button.className = 'option';
            button.type = 'button';
            button.textContent = label;
            button.addEventListener('click', action);
            menu.append(button);
        });
        chat.append(menu);
        scrollDown();
    }

    function addNotice() {
        const notice = document.createElement('p');
        notice.className = 'notice';
        notice.textContent = 'DEMO ESTÁTICA · Sin conexión a bases de datos, WhatsApp ni información real de Coomeva.';
        chat.append(notice);
    }

    function clearChat() { chat.replaceChildren(); }

    function showLegal(type) {
        legalTitle.textContent = text[type].title;
        legalText.innerHTML = text[type].body;
        legalModal.hidden = false;
    }

    function showConsent() {
        clearChat();
        addBubble('👋 ¡Hola! Soy el asistente virtual de Coomeva.<br><br>Antes de continuar, necesitamos tu autorización para atenderte de forma segura.');
        const form = document.createElement('form');
        form.className = 'consent';
        form.innerHTML = `
            <label class="check"><input type="checkbox" id="termsCheck"><span>Acepto los <a href="#terminos" data-legal="terms">términos y condiciones</a>.</span></label>
            <label class="check"><input type="checkbox" id="privacyCheck"><span>Autorizo el <a href="#privacidad" data-legal="privacy">tratamiento de mis datos personales</a> para validar mi afiliación y atender mi solicitud.</span></label>
            <button class="primary" type="submit">Aceptar y continuar</button>`;
        form.addEventListener('click', event => {
            const link = event.target.closest('[data-legal]');
            if (link) { event.preventDefault(); showLegal(link.dataset.legal); }
        });
        form.addEventListener('submit', event => {
            event.preventDefault();
            if (!form.querySelector('#termsCheck').checked || !form.querySelector('#privacyCheck').checked) {
                addBubble('Para continuar debes aceptar los términos y la autorización de tratamiento de datos.');
                return;
            }
            state.consent = true;
            showIdentification();
        });
        chat.append(form);
        addButton('No acepto', showAdvisorWaiting, 'text-button');
        addNotice();
    }

    function showIdentification() {
        clearChat();
        addBubble('Gracias por tu autorización. Para comenzar, escribe tu número de cédula.');
        const form = document.createElement('form');
        form.className = 'compose';
        form.innerHTML = '<input id="cedula" inputmode="numeric" autocomplete="off" maxlength="15" placeholder="Escribe tu número de cédula" required><button class="send" type="submit" aria-label="Enviar">➤</button>';
        form.addEventListener('submit', event => {
            event.preventDefault();
            const input = form.querySelector('#cedula');
            const documentNumber = input.value.trim();
            if (!/^\\d{6,15}$/.test(documentNumber)) {
                addBubble('Ingresa una cédula válida de 6 a 15 números.');
                return;
            }
            addBubble(escapeHtml(documentNumber), 'user');
            state.userType = documentNumber === '900000001' || documentNumber === '900000002' ? 'affiliate' : 'visitor';
            state.userName = documentNumber === '900000001' ? 'Ana Prueba' : 'Carlos Demo';
            setTimeout(showMainMenu, 220);
        });
        chat.append(form);
        addNotice();
    }

    function showMainMenu() {
        clearChat();
        if (state.userType === 'affiliate') {
            addBubble(`👋 ¡Bienvenido, ${state.userName}!<br><br>¿Qué deseas consultar?`);
            addMenu([
                { label: '📋 1. Mi plan', action: () => showInfo('📋 Mi plan', 'Esta demostración no consulta coberturas reales. En la versión productiva, esta opción se conectará con la fuente oficial autorizada por Coomeva.') },
                { label: '🏥 2. Mis servicios', action: () => showInfo('🏥 Mis servicios', 'El catálogo definitivo se mostrará únicamente desde la información oficial validada por Coomeva.') },
                { label: '📅 3. Citas médicas', action: () => showInfo('📅 Citas médicas', 'La solicitud, cancelación y reprogramación se habilitarán cuando exista una integración oficial. No compartas diagnósticos ni documentos médicos por este chat.') },
                { label: '🏨 4. Clínicas', action: () => showInfo('🏨 Clínicas', 'La red de clínicas se mostrará cuando Coomeva autorice la fuente oficial para este canal.') },
                { label: '👨‍⚕️ 5. Especialistas', action: () => showInfo('👨‍⚕️ Especialistas', 'La disponibilidad de especialistas requiere una integración con la información oficial de Coomeva.') },
                { label: '👨‍💼 6. Hablar con un asesor', action: assignAdvisor }
            ]);
        } else {
            addBubble('👋 No encontramos una afiliación asociada al documento ingresado.<br><br>Conoce nuestras opciones:');
            addMenu([
                { label: '📋 1. Conocer planes', action: () => showInfo('📋 Planes Coomeva', 'Contamos con opciones individuales y familiares. Las condiciones definitivas se comunicarán con contenido comercial aprobado por Coomeva.') },
                { label: '🏥 2. Conocer servicios', action: () => showInfo('🏥 Servicios', 'Un asesor puede orientarte sobre las alternativas disponibles cuando se publique el catálogo oficial.') },
                { label: '✨ 3. Beneficios', action: () => showInfo('✨ Beneficios', 'Los beneficios, coberturas y condiciones se comunicarán únicamente con contenido comercial aprobado.') },
                { label: '📝 4. Quiero afiliarme', action: assignAdvisor }
            ]);
        }
        addButton('Finalizar conversación', showConsent, 'text-button');
        addNotice();
    }

    function showInfo(title, message) {
        clearChat();
        addBubble(`<strong>${title}</strong><br><br>${message}`);
        addButton('Volver al menú', showMainMenu);
        addNotice();
    }

    function assignAdvisor() {
        clearChat();
        if (state.advisorAssigned) {
            addBubble('👨‍💼 Ya tienes un asesor asignado. Cuando termines, selecciona “Finalizar atención”.');
        } else if (state.advisorsAvailable > 0) {
            const name = state.advisorsAvailable === 2 ? 'Laura Asesora Demo' : 'Miguel Asesor Demo';
            state.advisorsAvailable -= 1;
            state.advisorAssigned = true;
            addBubble(`👨‍💼 Te asignamos a <strong>${name}</strong>.<br><br>En la versión real se abriría el canal autorizado del asesor. Esta demo no contacta a ninguna persona.`);
        } else {
            addBubble('⏳ En este momento todos los asesores están ocupados. Intenta nuevamente en unos minutos.');
            addButton('Volver al menú', showMainMenu);
            return;
        }
        addButton('Finalizar atención', () => {
            if (state.advisorAssigned) { state.advisorsAvailable += 1; state.advisorAssigned = false; }
            showMainMenu();
        });
        addNotice();
    }

    function showAdvisorWaiting() {
        clearChat();
        addBubble('Respetamos tu decisión. Para continuar con el asistente es necesario aceptar los términos y la autorización de tratamiento de datos.');
        addBubble('Un asesor te contactará únicamente por un canal previamente autorizado. No ingreses tu cédula ni información médica en esta pantalla.');
        addButton('Volver a revisar la autorización', showConsent);
        addNotice();
    }

    document.querySelector('#closeLegal').addEventListener('click', () => { legalModal.hidden = true; });
    legalModal.addEventListener('click', event => { if (event.target === legalModal) legalModal.hidden = true; });
    document.querySelector('#restart').addEventListener('click', () => {
        state = { consent: false, userType: null, userName: '', advisorsAvailable: 2, advisorAssigned: false };
        showConsent();
    });
    showConsent();
})();
</script>
</body>
</html>
